<!DOCTYPE html>
<html>
<head>

    <title>Login Page</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .login-box{

            width: 350px;
            background-color: white;
            padding: 25px;
            margin: 100px auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            text-align: center;
            color: #333;
        }

        label{
            font-weight: bold;
        }

        input[type=text],
        input[type=password]{

            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{

            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background-color: #45a049;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Login Form</h2>

        <form action="/login" method="post">

            <label>Username</label>
            <input type="text" name="email" placeholder="Enter username">

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password">

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
